<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aryan — Visual Portfolio Animation</title>
  <meta name="description" content="Smooth cinematic scroll-driven frame sequence animation.">
  <meta name="theme-color" content="#000000">
  
  <!-- Modern Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Loading Screen -->
  <div id="loader" class="loader-overlay">
    <div class="loader-content">
      <div class="loader-spinner-track">
        <div class="loader-spinner-bar" id="loader-bar"></div>
      </div>
      <div class="loader-meta">
        <div class="loader-status" id="loader-status">INITIALIZING FRAMES</div>
        <div class="loader-percentage" id="loader-percent">0%</div>
      </div>
    </div>
  </div>

  <!-- Scroll Progress / Frame Indicator (Minimal, Elegant) -->
  <div class="hud" id="hud">
    <div class="hud-item">
      <span class="hud-label">FRAME</span>
      <span class="hud-value" id="hud-frame">001 / 872</span>
    </div>
    <div class="hud-divider"></div>
    <div class="hud-item">
      <span class="hud-label">PROGRESS</span>
      <span class="hud-value" id="hud-progress">0%</span>
    </div>
  </div>

  <!-- Scroll Prompt -->
  <div class="scroll-prompt" id="scroll-prompt">
    <span class="scroll-prompt-text">SCROLL TO EXPLORE</span>
    <div class="scroll-prompt-arrow">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
    </div>
  </div>

  <!-- Fixed Canvas Viewport -->
  <div class="canvas-viewport">
    <canvas id="canvas"></canvas>
  </div>

  <!-- Scroll Container for Physical Travel -->
  <div class="scroll-track" id="scroll-track"></div>

  <script type="module" src="main.js"></script>
</body>
</html>
